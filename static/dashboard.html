<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>My Sessions — Yolex Labs</title>
  <meta name="description" content="Employee session dashboard — view upcoming and completed process improvement sessions"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/dashboard.css"/>
</head>
<body>

<div id="toasts"></div>
<div id="loading-overlay">
  <div class="ld-spin"></div>
  <div class="ld-text">Loading your sessions…</div>
</div>

<!-- ── Top bar ── -->
<header class="db-topbar" id="db-topbar">
  <div class="db-topbar-inner">
    <div class="db-brand">
      <div class="db-brand-mark">PA</div>
      <span class="db-brand-name">Process Agent</span>
    </div>
    <div class="db-topbar-right">
      <div class="db-user" id="db-user-area">
        <img class="db-avatar" id="db-avatar" src="" alt="Avatar" onerror="this.style.display='none'"/>
        <div class="db-avatar-fallback" id="db-avatar-fb">—</div>
        <div class="db-user-info">
          <div class="db-user-name" id="db-user-name">Loading…</div>
          <div class="db-user-role">Employee</div>
        </div>
      </div>
      <button class="db-signout-btn" id="db-signout" onclick="signOut()">Sign out</button>
    </div>
  </div>
</header>

<!-- ── Main content ── -->
<main class="db-main" id="db-main" style="display:none">
  <div class="db-inner">

    <!-- Greeting -->
    <div class="db-greeting" id="db-greeting">
      <h1 class="db-greeting-title" id="db-greeting-title">Good morning</h1>
      <p class="db-greeting-sub">Here are your process improvement sessions.</p>
    </div>

    <!-- Stats row -->
    <div class="db-stats" id="db-stats">
      <div class="db-stat-card">
        <div class="db-stat-value" id="stat-upcoming">—</div>
        <div class="db-stat-label">Upcoming</div>
      </div>
      <div class="db-stat-card">
        <div class="db-stat-value" id="stat-completed">—</div>
        <div class="db-stat-label">Completed</div>
      </div>
      <div class="db-stat-card">
        <div class="db-stat-value" id="stat-overdue">—</div>
        <div class="db-stat-label">Overdue</div>
      </div>
    </div>

    <!-- Upcoming sessions -->
    <section class="db-section" id="section-upcoming">
      <div class="db-section-header">
        <div class="db-section-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Upcoming Sessions
        </div>
      </div>
      <div id="upcoming-list" class="db-cards">
        <!-- filled by JS -->
      </div>
    </section>

    <!-- Completed sessions -->
    <section class="db-section" id="section-completed">
      <div class="db-section-header">
        <div class="db-section-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Completed Sessions
        </div>
      </div>
      <div id="completed-list" class="db-cards">
        <!-- filled by JS -->
      </div>
    </section>

  </div>
</main>

<!-- ── No sessions placeholder ── -->
<div id="db-empty" class="db-empty" style="display:none">
  <div class="db-empty-icon">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
  </div>
  <div class="db-empty-title">No sessions assigned yet</div>
  <div class="db-empty-sub">Your manager hasn't assigned a session to you. Check back soon.</div>
</div>

<script src="/static/dashboard.js"></script>
</body>
</html>
